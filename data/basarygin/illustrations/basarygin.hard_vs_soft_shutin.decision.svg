<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1042" width="640" height="1042" style="max-width:100%;height:auto"><rect width="640" height="1042" rx="14" fill="#1A2129"/><rect x="24" y="22" width="115" height="44" rx="8" fill="#8E44AD"/><text x="39.0" y="54.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="600" fill="#FFFFFF" text-anchor="start">схема</text><text x="24.0" y="108.0" font-family="Segoe UI,system-ui,sans-serif" font-size="34" font-weight="700" fill="#ECEFF4" text-anchor="start">Решение на данных</text><rect x="24" y="154" width="592" height="222" rx="12" fill="#0F1419" stroke="#F1C40F" stroke-width="3"/><text x="46.0" y="196.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="700" fill="#F1C40F" text-anchor="start">Признаки</text><text x="46.0" y="238.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">максимально допустимое давление</text><text x="46.0" y="276.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">на устье; прочность пород у</text><text x="46.0" y="314.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">башмака; скорость закрытия</text><text x="46.0" y="352.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">оборудования</text><polygon points="304.0,384 336.0,384 320.0,406" fill="#8A96A3"/><rect x="24" y="414" width="592" height="184" rx="12" fill="#0F1419" stroke="#3498DB" stroke-width="3"/><text x="46.0" y="456.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="700" fill="#3498DB" text-anchor="start">Правило</text><text x="46.0" y="498.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Жёсткое — меньше приток, но</text><text x="46.0" y="536.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">удары давления; мягкое — меньше</text><text x="46.0" y="574.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">ударов, но больше приток</text><polygon points="304.0,606 336.0,606 320.0,628" fill="#8A96A3"/><rect x="24" y="636" width="592" height="146" rx="12" fill="#0F1419" stroke="#2ECC71" stroke-width="3"/><text x="46.0" y="678.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="700" fill="#2ECC71" text-anchor="start">Вывод</text><text x="46.0" y="720.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Выбор по опыту месторождения и</text><text x="46.0" y="758.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">условиям</text><rect x="24" y="798" width="592" height="184" rx="12" fill="#0F1419" stroke="#E74C3C" stroke-width="3"/><text x="46.0" y="840.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="700" fill="#E74C3C" text-anchor="start">Но бывает иначе</text><text x="46.0" y="882.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">При слабых породах у башмака</text><text x="46.0" y="920.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">жёсткое закрытие опасно скачком</text><text x="46.0" y="958.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">давления</text><text x="24.0" y="1016.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="400" fill="#8A96A3" text-anchor="start">стр. 315, 316</text></svg>