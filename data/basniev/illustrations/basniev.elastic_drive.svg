<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Как сжатый пласт выталкивает жидкость</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">При пуске скважины в</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">условиях упругого режима</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">движение начинается за</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">счёт потенциальной</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">энергии упругой</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">деформации пласта и</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">жидкости. Сначала оно</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">возникает в ближайших</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">окрестностях забоя. Затем</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">охватывает всё более…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Коэффициенты объёмной</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">упругой деформации</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">жидкости и скелета очень</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">малы. Но очень велики</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">объёмы пласта и флюидов</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">в нём. Поэтому объёмы</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">жидкости, извлекаемой за</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">счёт упругости, могут быть</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">весьма значительными.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Малый коэффициент ещё</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">не означает малый эффект.</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Результат определяет</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">произведение малого</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коэффициента на большой</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">объём.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 474</text></svg>