<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Как сжатый пласт выталкивает жидкость</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">При пуске скважины в условиях</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">упругого режима движение</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">начинается за счёт</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">потенциальной энергии упругой</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">деформации пласта и жидкости.</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Сначала оно возникает в</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ближайших окрестностях забоя.</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Затем охватывает всё более</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">удалённые области пласта. Забой</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">— нижняя…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Коэффициенты объёмной упругой</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">деформации жидкости и скелета</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">очень малы. Но очень велики</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">объёмы пласта и флюидов в нём.</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Поэтому объёмы жидкости,</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">извлекаемой за счёт упругости,</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">могут быть весьма</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">значительными.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Малый коэффициент ещё не</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">означает малый эффект.</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Результат определяет</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">произведение малого</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коэффициента на большой объём.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 474</text></svg>