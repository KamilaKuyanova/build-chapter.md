<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Откуда ещё берётся напор</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В некоторых случаях приток к</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">забоям поддерживается и напором</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">воды, поступающей в пласт из</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">области питания. Тогда режим</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пласта следует называть</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">упруговодонапорным. Область</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">питания — место, откуда вода</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">поступает в пласт. Вторая</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разновидность — замкнуто-</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">упругий…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В начальной стадии разработки</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">закрытой залежи имеет место</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">замкнуто-упругий режим. Он</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">длится до тех пор, пока</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пластовое давление не снизилось</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">до давления насыщения.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">У замкнуто-упругого режима два</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">условия сразу: залежь закрыта и</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давление ещё не упало до</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давления насыщения.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 474, 475</text></svg>