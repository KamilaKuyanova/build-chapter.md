<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Как выглядит давление вдоль пласта</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Уравнение (23.25)</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">интегрируют с учётом</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">первого из условий (23.21).</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Получают P как интеграл</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">от экспоненты,</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">умноженный на C₁.</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Постоянную C₁ находят из</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">второго условия: верхний</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">предел интеграла</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">устремляют к…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Типичные кривые</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давления в разные</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">моменты времени</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">приведены на рис. 23.1.</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Они построены для</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">галереи, пущенной с</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">постоянным забойным</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давлением p_г. Забойное</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давление — давление на</text><text x="474.6666666666667" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">забое.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Координата и время входят</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">в (23.27) только вместе,</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">через один аргумент</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">интеграла вероятности.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 483, 484</text></svg>