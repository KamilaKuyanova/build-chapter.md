<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Когда пласт можно считать бесконечным</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Непосредственными расчётами</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Щелкачев установил следующее. В</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">громадном большинстве</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">практически интересных случаев</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давление при работе скважины в</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">конечном открытом пласте можно</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">изучать по (23.52). Это верно в</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">течение достаточно длительного</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">времени. Открытый…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Погрешность забойного давления</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">при этом не превзойдёт 0,08%</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">при F₀ ≤ 0,2. При F₀ ≤ 0,35 она</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">не больше 1%, при F₀ ≤ 0,5 — не</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">больше 1,9%. В любой точке</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">открытого кругового пласта при</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">r ≤ 0,1 R_к можно пользоваться</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">формулой (23.52). Точность при</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">этом высокая,…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Решения уравнения (23.40) для</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ограниченных открытых и</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">закрытых пластов представляются</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">бесконечными рядами по</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">специальным функциям Бесселя.</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Функции Бесселя — специальные</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">функции, через которые</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">записывают такие решения.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 492, 493</text></svg>