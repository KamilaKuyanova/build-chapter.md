<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Где формула теряет смысл</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В (23.38) подставляют граничное</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">условие: вдали давление равно</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">p_к. Там erf стремится к</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">единице, и возникает</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">неопределённость вида</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">бесконечность на нуль. Её</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">раскрывают по правилу Лопиталя:</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">произведение стремится к нулю.</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Экспонента при этом тоже</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">стремится к…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Решение (23.39) при очень</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">больших значениях времени</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">теряет физический смысл.</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Процесс во времени не</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ограничен. Поэтому можно</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">указать такие t, при которых</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">p_г(t) отрицательно.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Такой результат означает, что</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">условие постоянной скорости на</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">галерее слишком жёсткое. Для</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">его реализации нужны</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">отрицательные давления при</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">больших временах. Реально они</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">возникать не будут: вблизи</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">галереи возникнет кавитация.</text><text x="889.3333333333334" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Кавитация — образование</text><text x="889.3333333333334" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">полостей в…</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 487, 488</text></svg>