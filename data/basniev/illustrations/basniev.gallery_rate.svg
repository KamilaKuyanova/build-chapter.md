<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Почему дебит падает со временем</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Положительным считают</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">дебит, отбираемый из</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">галереи при x = 0. Тогда</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">поток движется против оси</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">x, а производная давления</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">по x положительна. По</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">закону Дарси (23.28)</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">скорость и дебит</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пропорциональны</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">градиенту давления у…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Из (23.30) следует: дебит</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">убывает с течением</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">времени как 1/√t. При t,</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">стремящемся к</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">бесконечности, он</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">стремится к нулю.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В момент t = 0 формула</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">даёт бесконечное</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">значение дебита. Это</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">следствие скачка давления</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">на галерее от p_к до p_г в</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">начальный момент.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 484, 485</text></svg>