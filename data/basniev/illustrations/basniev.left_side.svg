<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Почему малое слагаемое отбрасывают</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В левую часть (23.12)</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">подставляют уравнения</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">состояния (23.10) и (23.11) и</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">вычисляют произведение</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">mρ. Последнее слагаемое</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">содержит произведение</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">двух коэффициентов</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">упругости и квадрат</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разности давлений. Ввиду</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">малости по сравнению с…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Авторы напоминают</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">порядки величин. Для</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нефтей β_ж лежит от</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">7·10⁻¹⁰ до 30·10⁻¹⁰ Па⁻¹. Для</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пластовых вод — от</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">2,7·10⁻¹⁰ до 5·10⁻¹⁰ Па⁻¹. Для</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пласта коэффициент</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">объёмной упругости β_с</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">составляет (0,3–2)·10⁻¹⁰</text><text x="474.6666666666667" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Па⁻¹.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Отбросить слагаемое</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">можно именно из-за его</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">малости рядом с двумя</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">другими. Малость</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">обоснована приведёнными</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">диапазонами</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коэффициентов.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 479, 480</text></svg>