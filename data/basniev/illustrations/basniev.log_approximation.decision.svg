<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1232" width="640" height="1232" style="max-width:100%;height:auto"><rect width="640" height="1232" rx="14" fill="#1A2129"/><rect x="24" y="22" width="115" height="44" rx="8" fill="#8E44AD"/><text x="39.0" y="54.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="start">схема</text><text x="24.0" y="108.0" font-family="Segoe UI,system-ui,sans-serif" font-size="34" font-weight="700" fill="#ECEFF4" text-anchor="start">Решение на данных</text><rect x="24" y="154" width="592" height="184" rx="12" fill="#0F1419" stroke="#F1C40F" stroke-width="3"/><text x="46.0" y="196.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="700" fill="#F1C40F" text-anchor="start">Признаки</text><text x="46.0" y="238.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">x = r²/(4κt) в нужной точке и в</text><text x="46.0" y="276.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">нужный момент; Допустимая</text><text x="46.0" y="314.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">погрешность</text><polygon points="304.0,346 336.0,346 320.0,368" fill="#8A96A3"/><rect x="24" y="376" width="592" height="336" rx="12" fill="#0F1419" stroke="#3498DB" stroke-width="3"/><text x="46.0" y="418.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="700" fill="#3498DB" text-anchor="start">Правило</text><text x="46.0" y="460.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Считают x. При x ≤ 0,01</text><text x="46.0" y="498.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">погрешность логарифма не</text><text x="46.0" y="536.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">превосходит 0,25%, при x ≤ 0,1 —</text><text x="46.0" y="574.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">5,7%, при x ≤ 0,14 — 9,7%. Если</text><text x="46.0" y="612.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">допустима меньшая погрешность,</text><text x="46.0" y="650.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">берут (23.52) с табличной</text><text x="46.0" y="688.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">функцией.</text><polygon points="304.0,720 336.0,720 320.0,742" fill="#8A96A3"/><rect x="24" y="750" width="592" height="184" rx="12" fill="#0F1419" stroke="#2ECC71" stroke-width="3"/><text x="46.0" y="792.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="700" fill="#2ECC71" text-anchor="start">Вывод</text><text x="46.0" y="834.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Логарифмическая формула (23.53)</text><text x="46.0" y="872.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">годится там, где её погрешность</text><text x="46.0" y="910.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">устраивает расчёт.</text><rect x="24" y="950" width="592" height="222" rx="12" fill="#0F1419" stroke="#E74C3C" stroke-width="3"/><text x="46.0" y="992.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="700" fill="#E74C3C" text-anchor="start">Но бывает иначе</text><text x="46.0" y="1034.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Далёкая точка или ранний момент:</text><text x="46.0" y="1072.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">x больше 0,14, оценка</text><text x="46.0" y="1110.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">погрешности в главе для него не</text><text x="46.0" y="1148.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">дана.</text><text x="24.0" y="1206.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="400" fill="#8A96A3" text-anchor="start">стр. 491</text></svg>