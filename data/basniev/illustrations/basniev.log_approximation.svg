<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Когда хватает простого логарифма</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Интегральную показательную</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">функцию можно представить в</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">виде ряда. Он сходится при всех</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">значениях x больше нуля. Ряд</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">содержит постоянную Эйлера γ.</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Это иррациональное число, в</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">подземной гидромеханике его</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">принимают равным 0,5772. При</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">изменении x от нуля до…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Погрешность этой замены не</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">превосходит 0,25% при x ≤ 0,01.</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">При x ≤ 0,1 она не больше 5,7%.</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">При x ≤ 0,14 — не больше 9,7%.</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Здесь x = r²/(4κt). Отсюда</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">логарифмическая формула</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давления (23.53). В тексте</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">условие для неё распознано как</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">r²/(4κt) ≤ 1. Погрешности…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Одна и та же формула точна</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">вблизи скважины и груба вдали.</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Величина x растёт с расстоянием</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">и уменьшается со временем.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 491</text></svg>