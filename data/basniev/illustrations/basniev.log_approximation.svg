<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Когда хватает простого логарифма</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Интегральную</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">показательную функцию</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">можно представить в виде</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ряда. Он сходится при всех</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">значениях x больше нуля.</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Ряд содержит постоянную</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Эйлера γ. Это</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">иррациональное число, в</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">подземной гидромеханике</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">его принимают равным…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Погрешность этой замены</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">не превосходит 0,25% при</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">x ≤ 0,01. При x ≤ 0,1 она не</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">больше 5,7%. При x ≤ 0,14</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">— не больше 9,7%. Здесь x</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">= r²/(4κt). Отсюда</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">логарифмическая формула</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давления (23.53). В тексте</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">условие для неё</text><text x="474.6666666666667" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">распознано как r²/(4κt) ≤…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Одна и та же формула</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">точна вблизи скважины и</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">груба вдали. Величина x</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">растёт с расстоянием и</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">уменьшается со временем.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 491</text></svg>