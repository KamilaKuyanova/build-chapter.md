<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Из каких уравнений собрана модель</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Для вывода нужны уравнение</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">неразрывности потока, уравнения</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">движения и уравнения состояния.</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Уравнение неразрывности —</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">запись баланса массы. Уравнение</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">движения здесь — закон Дарси:</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">скорость фильтрации</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пропорциональна градиенту</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давления. Градиент — быстрота…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В новой записи поток массы</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">равен градиенту P с обратным</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">знаком. Баланс массы связывает</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">изменение произведения mρ во</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">времени с оператором Лапласа от</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">P.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Запись через P верна после</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пренебрежения массовыми силами.</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Заглавная P здесь — функция</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Лейбензона, а не давление p.</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Знак Δ перед P — оператор</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Лапласа, а не разность.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 478</text></svg>