<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Было шесть строк, станет одна</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Берут модель упругого</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">флюида, подчиняющегося</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">закону Дарси, в</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">деформируемой пористой</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">среде (23.9). К ней</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">добавляют уравнения</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">состояния (23.10) и (23.11) и</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">постоянство k и μ.</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Получается полная система</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">уравнений. При…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Порядок вывода: собрать</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">систему, выбрать</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">уравнение баланса,</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">подставить функцию</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Лейбензона,</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">преобразовать обе части.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Постоянные k и μ —</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">условие этого вывода:</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">только с ними множитель</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">k/μ стоит перед</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">оператором в (23.12).</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 479</text></svg>