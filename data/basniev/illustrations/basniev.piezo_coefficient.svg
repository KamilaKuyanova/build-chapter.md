<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Число, которое задаёт темп пласта</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Коэффициент κ</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">характеризует скорость</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">перераспределения</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пластового давления при</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">неустановившейся</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">фильтрации упругой</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">жидкости в упругой среде.</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В.Н.Щелкачев назвал его</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коэффициентом</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пьезопроводности пласта…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Наиболее часто</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">встречающиеся в</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нефтепромысловой</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">практике значения κ лежат</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">в пределах от 0,1 до 5 м²/с.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Пределы относятся к</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">наиболее часто</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">встречающимся</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">значениям, а не ко всем</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">возможным. В</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">размерности κ длина стоит</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">в квадрате. Поэтому κ</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">характеризует темп, но это</text><text x="889.3333333333334" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">не скорость фронта в</text><text x="889.3333333333334" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">метрах за секунду.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 480, 481</text></svg>