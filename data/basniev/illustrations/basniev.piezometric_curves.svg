<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Форма воронки давления у скважины</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Рассматривают пьезометрические</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">кривые вблизи скважины с</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">постоянным дебитом Q₀. Они</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">показаны на рис. 23.4.</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Пьезометрическая кривая —</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">график давления вдоль пласта.</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Для точек вблизи забоя годится</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">логарифмическая формула</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">(23.53). Дифференцируют её по</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">координате r…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Для указанных r кривые</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">представляют собой</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">логарифмические линии. Давление</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">на забое падает с течением</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">времени. Углы наклона</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">касательных на забое одинаковы</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">для всех кривых.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Вывод о градиенте верен только</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">вблизи скважины, пока r² не</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">больше 0,03·4κt. Из неравенства</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">видно, что с ростом времени эта</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">область расширяется.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 493</text></svg>