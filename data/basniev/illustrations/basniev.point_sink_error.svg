<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Насколько врёт нулевой радиус</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Строго говоря, формула (23.52)</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">справедлива лишь для точечного</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">стока, когда r_с = 0, в</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">неограниченном пласте, когда</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">R_к бесконечен. В.Н.Щелкачев</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">оценил влияние конечного</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">радиуса скважины. Он сравнил</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">расчёты по (23.52) с точной</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">формулой Ван-Эвердингена и…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Погрешность подсчётов давления</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">по (23.52) составляет 0,6% при</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">f₀ = 100 и 2,3% при f₀ = 25.</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">При f₀ = 10 она 5%, при f₀ = 5</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">— 9,4%. Практический смысл</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">оценили на примере. Пусть κ = 1</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">м²/с и r_с = 0,1 м. При f₀ =</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">100 получается t = 1 с. Значит,</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">уже через 1 с…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Отсюда вывод авторов. Для</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">скважин обычных размеров</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">формула обеспечивает высокую</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">степень точности уже на самой</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ранней стадии процесса. На</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">поздней — тем более.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 492</text></svg>