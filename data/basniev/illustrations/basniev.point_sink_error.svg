<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Насколько врёт нулевой радиус</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Строго говоря, формула</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">(23.52) справедлива лишь</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">для точечного стока, когда</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">r_с = 0, в неограниченном</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пласте, когда R_к</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">бесконечен. В.Н.Щелкачев</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">оценил влияние конечного</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">радиуса скважины. Он</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сравнил расчёты по (23.52)</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">с точной формулой…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Погрешность подсчётов</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давления по (23.52)</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">составляет 0,6% при f₀ =</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">100 и 2,3% при f₀ = 25. При</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">f₀ = 10 она 5%, при f₀ = 5</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">— 9,4%. Практический</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">смысл оценили на</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">примере. Пусть κ = 1 м²/с и</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">r_с = 0,1 м. При f₀ = 100</text><text x="474.6666666666667" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">получается t = 1 с. Значит…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Отсюда вывод авторов.</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Для скважин обычных</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">размеров формула</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">обеспечивает высокую</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">степень точности уже на</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">самой ранней стадии</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">процесса. На поздней —</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">тем более.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 492</text></svg>