<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Когда вместо формулы берут график</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В скважине поддерживают</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">постоянное забойное давление.</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Закон движения границы</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">возмущённой области выражается</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">интегралом. Интеграл</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">представляется медленно</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сходящимся рядом, поэтому</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">решение здесь не приводится.</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Движение границы можно</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">определить по графику рис.…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Дебит скважины определяют по</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">формуле Дюпюи (24.11) при</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">постоянном давлении в скважине.</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Сравнение с точными расчётами</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">К.А.Царевича и И.Ф.Куранова</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">показывает: погрешность дебита</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">по методу ПССС составляет около</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">5%.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Погрешность около 5% относится</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">к дебиту скважины с постоянным</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давлением. Число приведено</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">приблизительно. Решение для</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">границы в книге не приведено:</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">его представляют медленно</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сходящимся рядом.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 499</text></svg>