<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Как быстро бежит граница возмущения</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Рассматривают прямолинейно-</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">параллельный неустановившийся</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">поток. В горизонтальном пласте</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">толщины h и ширины B при t = 0</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пускают прямолинейную галерею с</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">постоянным дебитом Q. До пуска</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давление во всём пласте было</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">одинаковым и равным p_к. К</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">моменту t граница…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Подставив l(t), получают</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">распределение давления в пласте</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">(24.7). До расстояния √(2κt)</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">оно линейное, дальше давление</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">равно p_к.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Граница движется</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пропорционально корню из</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">времени, а не времени. Поэтому</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">она движется не с постоянной</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">скоростью. Линейное</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">распределение здесь —</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">предположение метода, а не</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">точное решение.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 495, 496</text></svg>