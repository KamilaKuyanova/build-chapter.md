<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 984" width="640" height="984" style="max-width:100%;height:auto"><rect width="640" height="984" rx="14" fill="#1A2129"/><rect x="24" y="22" width="115" height="44" rx="8" fill="#8E44AD"/><text x="39.0" y="54.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="600" fill="#FFFFFF" text-anchor="start">схема</text><text x="24.0" y="108.0" font-family="Segoe UI,system-ui,sans-serif" font-size="34" font-weight="700" fill="#ECEFF4" text-anchor="start">Место шага в главе</text><text x="24.0" y="162.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="400" fill="#8A96A3" text-anchor="start">опирается на</text><rect x="24" y="178" width="592" height="66" rx="12" fill="#0F1419" stroke="#3498DB" stroke-width="3"/><text x="46.0" y="220.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Зачем точному решению замена</text><rect x="24" y="256" width="592" height="66" rx="12" fill="#0F1419" stroke="#3498DB" stroke-width="3"/><text x="46.0" y="298.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Баланс отбора и упругого запаса</text><rect x="24" y="334" width="592" height="104" rx="12" fill="#0F1419" stroke="#3498DB" stroke-width="3"/><text x="46.0" y="376.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Форма воронки давления у</text><text x="46.0" y="414.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">скважины</text><polygon points="304.0,446 336.0,446 320.0,468" fill="#8A96A3"/><rect x="24" y="476" width="592" height="104" rx="12" fill="#F1C40F" stroke="#F1C40F" stroke-width="3"/><text x="46.0" y="518.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="700" fill="#0F1419" text-anchor="start">Движение как череда замерших</text><text x="46.0" y="556.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="700" fill="#0F1419" text-anchor="start">кадров</text><polygon points="304.0,588 336.0,588 320.0,610" fill="#8A96A3"/><text x="24.0" y="636.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="400" fill="#8A96A3" text-anchor="start">ведёт к</text><rect x="24" y="652" width="592" height="66" rx="12" fill="#0F1419" stroke="#2ECC71" stroke-width="3"/><text x="46.0" y="694.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Пока граница бежит и когда дошла</text><rect x="24" y="730" width="592" height="104" rx="12" fill="#0F1419" stroke="#2ECC71" stroke-width="3"/><text x="46.0" y="772.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Как быстро бежит граница</text><text x="46.0" y="810.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">возмущения</text><rect x="24" y="846" width="592" height="66" rx="12" fill="#0F1419" stroke="#2ECC71" stroke-width="3"/><text x="46.0" y="888.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Тот же приём вокруг скважины</text><text x="24.0" y="958.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="400" fill="#8A96A3" text-anchor="start">построено из связей шагов · стр. 494</text></svg>