<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Тот же приём вокруг скважины</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В неограниченном горизонтальном</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пласте толщины h при t = 0</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пускают добывающую скважину</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">радиуса r_с с постоянным</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">дебитом Q. До пуска давление во</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">всём пласте было одинаковым и</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">равным p_к. Поток</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">плоскорадиальный. По методу</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ПССС через время t вокруг</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">скважины…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Размеры возмущённой области</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">находят из баланса (24.2). Для</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">этого берут объём кольца между</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">стенкой скважины и границей</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">(24.12). Среднее по объёму</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давление в установившемся</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">плоскорадиальном потоке</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">определяется по формуле</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">(20.25). С учётом (24.11) из</text><text x="474.6666666666667" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">неё находят…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Здесь радиус скважины r_с</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">учтён, в отличие от основной</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">формулы, справедливой для</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">точечного стока.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 492, 497, 498</text></svg>