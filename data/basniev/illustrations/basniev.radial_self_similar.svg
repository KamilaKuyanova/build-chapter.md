<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Снова одна переменная вместо двух</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Как и раньше, проводят</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">анализ размерностей.</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Искомое давление зависит</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">от пяти параметров: r, t, κ,</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">p_к и комплекса из дебита,</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">вязкости, проницаемости и</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">толщины. Из пяти</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">параметров три имеют</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">независимые размерности:</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">r, t и p_к. Поэтому…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Здесь безразмерное</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давление — просто p,</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">делённое на p_к. В задаче</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">о галерее P была</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разностью, делённой на</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разность.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Второй безразмерный</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">параметр — комплекс из</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">дебита и свойств пласта,</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">делённый на p_к. Он не</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">зависит ни от координаты,</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ни от времени.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 482, 489</text></svg>