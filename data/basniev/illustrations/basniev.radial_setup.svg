<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Теперь поток идёт к скважине</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Пласт неограниченный,</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">горизонтальный, постоянной</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">толщины h. Начальное пластовое</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давление во всём пласте</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">одинаково и равно p_к.</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Добывающая скважина имеет</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нулевой радиус, это точечный</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сток. Точечный сток — место,</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">где жидкость отбирают в одной</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">точке. При t = 0…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Условия задачи записаны</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">формулами (23.41). До пуска</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давление везде постоянно и</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">равно контурному. Вдали при</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">любом времени оно остаётся</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">контурным. Дебит скважины</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">поддерживается постоянным;</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">последнее условие записывают в</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">виде (23.42).</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Из второго условия следует, что</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">граница возмущённой зоны</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">перемещается с ростом времени и</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">при больших временах стремится</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">к бесконечности. Граница</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">возмущённой зоны — значение</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">радиуса, на котором давление</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">равно контурному. Скважина</text><text x="889.3333333333334" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нулевого радиуса — упрощение:…</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 488, 489</text></svg>