<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Две переменные сливаются в одну</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Анализ размерностей</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">показывает, что задача</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">автомодельна. Анализ</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">размерностей —</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сравнение единиц</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">величин, входящих в</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">задачу. Автомодельна</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">значит, что из аргументов</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">можно составить один</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">безразмерный комплекс…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Граничные условия (23.20)</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">переходят в (23.21): P</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">равно 0 при u = 0 и равно</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">1 при u, стремящемся к</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">бесконечности. В силу</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">линейности уравнения</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">(23.19) для P получается</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">такое же уравнение (23.22),</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">как для давления p.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Одинаковое уравнение для</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">P и p — следствие</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">линейности (23.19). Без</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">линейности этот шаг не</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">был бы законен.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 482</text></svg>