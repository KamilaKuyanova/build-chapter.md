<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Почему пласт отвечает медленно</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Характерная особенность</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">упругого режима — длительность</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">перераспределения пластового</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давления. Процесс начинается</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">после начала работы скважины</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">или изменения темпа отбора.</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Причина в том, что при</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">фильтрации вязкой жидкости</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">возникают очень большие силы…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Темп процесса зависит сразу от</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">четырёх величин: k, μ, β_ж и</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">β_с. Первая ускоряет процесс,</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">остальные три замедляют.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Первыми теорию упругого режима</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разрабатывали в 30-х годах</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">20-го века Маскет, Шилсуиз,</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Херст, Тсейс и Джекоб. Однако</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">объёмную упругость пласта они</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">не учитывали. Наиболее полно</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">теорию с упругостью и скелета,</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">и жидкостей разработал</text><text x="889.3333333333334" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В.Н.Щелкачев.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 475</text></svg>