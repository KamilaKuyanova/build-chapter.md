<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Что движется, когда скважину пустили</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">При разработке</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">месторождений в пластах</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">часто возникают</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">неустановившиеся</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">процессы.</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Неустановившийся</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">процесс — тот, где</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давление и скорости</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">меняются со временем. Его</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">вызывают пуск или…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Математическая модель</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">главы учитывает упругие</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">силы только в однофазном</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">потоке, то есть без</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">свободного газа. Для этого</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">считается, что давление в</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">любой точке потока выше</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">давления насыщения</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">жидкости газом.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Вывод о ведущей роли</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">упругой энергии сделан</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">для рассматриваемых</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">неустановившихся</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">процессов, а не для</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">всякого движения в пласте.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 474</text></svg>