<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Скорость подчиняется тому же уравнению</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">После умножения и</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">дифференцирования меняют</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">порядок вычисления производных.</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Получается уравнение (23.32).</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Величина в скобках — скорость</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">фильтрации w, поэтому уравнение</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">переписывают в виде (23.33).</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Уравнение (23.33) по форме</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">совпадает с уравнением…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Из условий находят константы.</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">При t = 0 интеграл равен</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">половине корня из π, и сумма C₁</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">и C₂ равна нулю. При x = 0</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">интеграл обращается в нуль,</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">поэтому C₂ равна w₁, а C₁ равна</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">минус w₁. Получается (23.35).</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Перенос решения законен, потому</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">что уравнение совпадает по</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">форме. Но начальное и граничное</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">условия у скорости свои, их</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">надо иметь в виду.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 486</text></svg>