<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Зачем практику эта теория</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Изучение гидродинамики упругого</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">режима имеет важнейшее значение</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">для теории и для практики</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разработки нефтяных и газовых</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">месторождений. Её знание</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">позволяет наиболее полно</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">использовать упругий запас</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">флюидов для притока к</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">скважинам. Оно также позволяет</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">правильно…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Как правило, при естественном</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">упругом режиме добывается</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">незначительная часть</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">извлекаемых запасов: до 2–5%.</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Извлекаемые запасы — та часть</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нефти, которую можно добыть.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Однако известны случаи, когда</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">упругий запас очень велик. Он</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">позволяет отобрать гораздо</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">больший процент извлекаемых</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">запасов. Пример авторов —</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">крупнейшее месторождение</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Тенгиз: при упругом режиме там</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">будет отобрано до 20% запасов</text><text x="889.3333333333334" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нефти.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 477, 478</text></svg>