<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Риф-кольцо с лагуной внутри</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В атолловидных рифах и атоллах</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">появляются новые фациальные</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">зоны. Характер зональности</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">становится более сложным.</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Биогермные и мелкообломочные</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">породы ядра располагаются уже</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">не в центре. Они образуют</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">кольцо или овал по периферии</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">рифового комплекса. Как и в…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В подписи к рис. 10.1 автор</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">перечисляет пять групп фаций. 1</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">— ядра рифа (биогермные), 2 —</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">предрифового шлейфа, 3 —</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">тыльно-рифовые. 4 — межрифовые</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">и предрифовые, в той или иной</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">степени глубоководные. 5 —</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">мелководные внерифовые</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">(внебиогермные).</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Обломочные известняки есть по</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">обе стороны гребня, но тыльные</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">более тонкие. Наличие обломков</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">само по себе не говорит, с</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">какой стороны гребня взят</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">образец.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 201, 203, 204</text></svg>