<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Риф больше чем наполовину из обломков</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В большинстве рифовых</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">комплексов по</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">распространённости ведут</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">обломочные разности</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">известняков. Их содержание</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">часто превышает 50 %, а нередко</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">достигает 60–80 % и более.</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Крупнообломочных известняков</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">количественно меньше. Однако</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">они характерны именно для…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Очень характерны частая</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">перекристаллизация и</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">доломитизация рифов или их</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">значительных участков. Нередко</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">она почти полная.</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Перекристаллизация — рост новых</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">кристаллов на месте прежних.</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Доломитизация — превращение</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">известняка в доломит.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">«Характерны» и «преобладают» —</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разные вещи. Крупнообломочные</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">известняки характерны именно</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">для рифовых фаций, но</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">количественно подчинённые.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 202, 203</text></svg>