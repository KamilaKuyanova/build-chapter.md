<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1232" width="640" height="1232" style="max-width:100%;height:auto"><rect width="640" height="1232" rx="14" fill="#1A2129"/><rect x="24" y="22" width="115" height="44" rx="8" fill="#8E44AD"/><text x="39.0" y="54.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="600" fill="#FFFFFF" text-anchor="start">схема</text><text x="24.0" y="108.0" font-family="Segoe UI,system-ui,sans-serif" font-size="34" font-weight="700" fill="#ECEFF4" text-anchor="start">Решение на данных</text><rect x="24" y="154" width="592" height="260" rx="12" fill="#0F1419" stroke="#F1C40F" stroke-width="3"/><text x="46.0" y="196.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="700" fill="#F1C40F" text-anchor="start">Признаки</text><text x="46.0" y="238.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">направление регионального</text><text x="46.0" y="276.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">наклона; превышение рифа над</text><text x="46.0" y="314.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">зарифовым бассейном; положение</text><text x="46.0" y="352.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">предрифовых фаций по высоте;</text><text x="46.0" y="390.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">наличие экрана в тыльной зоне</text><polygon points="304.0,422 336.0,422 320.0,444" fill="#8A96A3"/><rect x="24" y="452" width="592" height="298" rx="12" fill="#0F1419" stroke="#3498DB" stroke-width="3"/><text x="46.0" y="494.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="700" fill="#3498DB" text-anchor="start">Правило</text><text x="46.0" y="536.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Наклон во впадину — критическое</text><text x="46.0" y="574.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">направление ищут в</text><text x="46.0" y="612.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">тыльно-рифовой зоне. Наклон</text><text x="46.0" y="650.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">противоположный, предрифовые</text><text x="46.0" y="688.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">фации выше рифовых — ищут в</text><text x="46.0" y="726.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">предрифовой зоне.</text><polygon points="304.0,758 336.0,758 320.0,780" fill="#8A96A3"/><rect x="24" y="788" width="592" height="184" rx="12" fill="#0F1419" stroke="#2ECC71" stroke-width="3"/><text x="46.0" y="830.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="700" fill="#2ECC71" text-anchor="start">Вывод</text><text x="46.0" y="872.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">В какой зоне закладывать</text><text x="46.0" y="910.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">скважины, чтобы проверить</text><text x="46.0" y="948.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">замыкание ловушки.</text><rect x="24" y="988" width="592" height="184" rx="12" fill="#0F1419" stroke="#E74C3C" stroke-width="3"/><text x="46.0" y="1030.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="700" fill="#E74C3C" text-anchor="start">Но бывает иначе</text><text x="46.0" y="1072.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Противоположный наклон</text><text x="46.0" y="1110.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">встречается реже, но правило для</text><text x="46.0" y="1148.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">него обратное.</text><text x="24.0" y="1206.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="400" fill="#8A96A3" text-anchor="start">стр. 221</text></svg>