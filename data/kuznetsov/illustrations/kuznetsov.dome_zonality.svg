<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Из чего сложен риф-купол</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">По морфологии и типу</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">поперечного сечения одиночные</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">рифы могут быть трёх видов. Это</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">куполовидные, плосковершинные и</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">атоллы. Атолл — кольцевой риф.</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Одиночные куполовидные рифы</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">включают две основные литолого-</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">фациальные зоны. Это ядро рифа</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">и его склон, то есть…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Отложения предрифового шлейфа</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">часто обладают видимой первично</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">не горизонтальной слоистостью.</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Первичная — значит слои легли</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">наклонно сразу, при накоплении.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Фации ядра часто интенсивно</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">перекристаллизованы и</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">доломитизированы в результате</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">вторичных процессов. Вторичные</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">процессы идут уже после</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">накопления осадка. Тогда ядро</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сложено кристаллическими</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">известняками и доломитами.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 203</text></svg>