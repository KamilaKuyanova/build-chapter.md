<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Группа третья: сложны и ловушка, и резервуар</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Третья группа залежей связана с</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">асимметричными рифовыми</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">системами. Высота ловушки</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">определяется тремя вещами.</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Первая — величина первичного</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">превышения рифового гребня над</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">зарифовыми отложениями. Обычно</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">она относительно невелика.</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Вторая — есть ли</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">литологический…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Первые разведочные скважины</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">обычно располагаются на</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">участке, наиболее приподнятом в</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">современном структурном плане.</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Структурный план — современное</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">положение слоёв по высоте. Зоны</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">улучшенных свойств часто</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">смещены к фронтальным частям.</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Это позволяет…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Смещение скважин автор даёт</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">мягко: «позволяет</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">рекомендовать» и «некоторое». А</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">исследование фронтальных фаций</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">— уже обязательно, «в любом</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">случае необходимо».</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 221</text></svg>