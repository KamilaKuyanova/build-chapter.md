<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Один риф менял форму со временем</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В разных возрастных</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">интервалах рифа</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Карачаганак коллекторы</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">распределены различно</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">[«Геология и</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нефтегазоносность...»,</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">1988]. Пермская часть —</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">куполовидный риф. В его</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">центральной биогермной</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">зоне доля пор размером…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Порядок разбора такой:</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сначала определяют</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">возрастной интервал и</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">форму рифа в нём. Затем</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сравнивают свойства по</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">зонам этой формы: ядро,</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">склон и шлейф у купола,</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">гребень, лагуна и склон у</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">атолла.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Склон купола и склон</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">атолла ведут себя</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">по-разному. У купола</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">склон заметно хуже ядра. У</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">атолла склон по</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">кавернозности занимает</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">место между гребнем и</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">лагуной. Диапазоны по</text><text x="889.3333333333334" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">скважинам широкие и</text><text x="889.3333333333334" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">перекрываются: в гребне…</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 209</text></svg>