<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Один риф менял форму со временем</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В разных возрастных интервалах</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">рифа Карачаганак коллекторы</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">распределены различно</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">[«Геология и</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нефтегазоносность...», 1988].</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Пермская часть — куполовидный</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">риф. В его центральной</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">биогермной зоне доля пор</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">размером более 0,1 мм в поровых</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллекторах 30–31 %. На…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Порядок разбора такой: сначала</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">определяют возрастной интервал</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">и форму рифа в нём. Затем</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сравнивают свойства по зонам</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">этой формы: ядро, склон и шлейф</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">у купола, гребень, лагуна и</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">склон у атолла.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Склон купола и склон атолла</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ведут себя по-разному. У купола</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">склон заметно хуже ядра. У</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">атолла склон по кавернозности</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">занимает место между гребнем и</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">лагуной. Диапазоны по скважинам</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">широкие и перекрываются: в</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">гребне 13,2–57,5 %, на склоне</text><text x="889.3333333333334" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">10,1–40,4 %. Отдельная…</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 209</text></svg>