<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Решение на данных: Риф тонул, мелел и становился</text><text x="40" y="110" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">островом</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Признаки</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">собственно морские</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">осадки относительно</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">глубокой воды;</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">обломочные и оолитовые</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">карбонатные осадки;</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">эоловые осадки, следы</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">выветривания,</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">выщелачивания и карста</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Правило</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Первое — этап подводного</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">плато, второе — этап</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">отмели на уровне моря,</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">третье — этап острова.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Вывод</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Этап роста рифа в данном</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">интервале разреза; на</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">этапе острова ждут зону</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">выщелачивания.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">признаки → правило → вывод · стр. 209, 212, 214</text></svg>