<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Риф тонул, мелел и становился островом</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Первая группа факторов и</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">главная — специфические</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">палеогеографические условия</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">рифообразования. В определённые</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">этапы риф — подводное,</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">относительно глубоководное</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">плато. На плато ослаблена</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">волновая активность. Там</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">накапливаются собственно</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">морские осадки. У них…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">По осадкам узнают этап роста.</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Собственно морские осадки</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">указывают на относительно</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">глубоководное плато. Обломочные</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">и оолитовые — на отмель.</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Эоловые, а также следы карста —</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">на остров.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Главным на этапе острова автор</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">называет субаэральное</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">выветривание, выщелачивание и</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">карстование. Но зона</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">выщелачивания имеет ограничения</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">по мощности.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 209, 212, 214</text></svg>