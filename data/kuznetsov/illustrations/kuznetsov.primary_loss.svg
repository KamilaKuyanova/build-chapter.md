<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Риф теряет пустоты, пока растёт</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="578.0" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Первичная пористость в чистом виде и в</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">полном объёме практически не сохраняется.</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Она может сокращаться уже в процессе</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">роста рифа. Первая причина — развитие</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">инкрустирующих водорослей. Они</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">обрастают стенки пустот. Вторая причина —</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">субаквальная цементация.…</text><polygon points="627.0,387 653.0,405 627.0,423" fill="#8A96A3"/><rect x="662.0" y="170" width="578.0" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="682.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="682.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Автор пишет «практически не сохраняется»</text><text x="682.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">и «в чистом виде и в полном объёме». Это</text><text x="682.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">не значит, что от первичных пустот не</text><text x="682.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">остаётся ничего.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 205</text></svg>