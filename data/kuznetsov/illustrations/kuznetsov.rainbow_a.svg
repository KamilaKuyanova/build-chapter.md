<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Один риф — пять групп коллекторов</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Автор приводит данные по</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">резервуару хорошо изученного</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">рифа Рейнбоу «А» в Канаде (рис.</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">10.2) [Langton, Chin, 1968].</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Это островершинный риф</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">(пиннакл) общей мощностью</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">200–250 м. Из них 90 м</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нефтенасыщены и 60 м</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">газонасыщены, то есть заполнены</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нефтью и газом. Риф…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">На рис. 10.2 породы разделены</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">на пять групп коллекторов. I:</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пористость 10–30 %,</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">проницаемость 50–2000·10⁻¹⁵ м².</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">II: пористость 15–35 %,</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">проницаемость 30–30000·10⁻¹⁵</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">м². III: пористость 8–15 %,</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">проницаемость (5–30)·10⁻¹⁵ м².</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">IV: пористость 8–25 %,…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Группы I и IV по пористости</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">перекрываются: 10–30 % и 8–25</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">%. По проницаемости они разные:</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">50–2000·10⁻¹⁵ м² против менее</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">50·10⁻¹⁵ м². Значит, по одной</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пористости группу не</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">определить.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 205, 206, 207</text></svg>