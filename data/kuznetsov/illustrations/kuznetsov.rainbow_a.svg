<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Один риф — пять групп коллекторов</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Автор приводит данные по</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">резервуару хорошо</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">изученного рифа Рейнбоу</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">«А» в Канаде (рис. 10.2)</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">[Langton, Chin, 1968]. Это</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">островершинный риф</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">(пиннакл) общей</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">мощностью 200–250 м. Из</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">них 90 м нефтенасыщены и</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">60 м газонасыщены, то ес…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">На рис. 10.2 породы</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разделены на пять групп</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллекторов. I: пористость</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">10–30 %, проницаемость</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">50–2000·10⁻¹⁵ м². II:</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пористость 15–35 %,</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">проницаемость</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">30–30000·10⁻¹⁵ м². III:</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пористость 8–15 %,</text><text x="474.6666666666667" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">проницаемость (5–30)·10⁻…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Группы I и IV по</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пористости</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">перекрываются: 10–30 % и</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">8–25 %. По проницаемости</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">они разные: 50–2000·10⁻¹⁵</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">м² против менее 50·10⁻¹⁵</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">м². Значит, по одной</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пористости группу не</text><text x="889.3333333333334" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">определить.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 205, 206, 207</text></svg>