<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Как отличить риф от холма и пласта</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Рифы — сложные</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">геологические</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">образования. Они</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">возникают в результате</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">жизнедеятельности</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">колониальных или</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нарастающих организмов.</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Риф представляет собой</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">карбонатный массив. Он</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сложен, по крайней мере…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Для геологов-нефтяников</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">наибольший интерес</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">представляют рифы в</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">узком, буквальном смысле</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">слова. Именно их</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">резервуары и частично</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ловушки описаны в книге.</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Природный резервуар —</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">проницаемые породы, в</text><text x="474.6666666666667" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">которых могут находиться…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В подписи к рис. 10.1 есть</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">буквы размеров. N —</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">десятки, сотни, иногда</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">первые тысячи метров.</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Буква n — метры, реже</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">первые десятки метров.</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Какой именно размер ими</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">отмечен, видно только на</text><text x="889.3333333333334" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">самом рисунке. Остатки</text><text x="889.3333333333334" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">организмов составляют…</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 201, 202</text></svg>