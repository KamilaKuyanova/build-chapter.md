<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 966" width="640" height="966" style="max-width:100%;height:auto"><rect width="640" height="966" rx="14" fill="#1A2129"/><rect x="24" y="22" width="115" height="44" rx="8" fill="#8E44AD"/><text x="39.0" y="54.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="start">схема</text><text x="24.0" y="108.0" font-family="Segoe UI,system-ui,sans-serif" font-size="34" font-weight="700" fill="#ECEFF4" text-anchor="start">Решение на данных</text><rect x="24" y="154" width="592" height="146" rx="12" fill="#0F1419" stroke="#F1C40F" stroke-width="3"/><text x="46.0" y="196.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="700" fill="#F1C40F" text-anchor="start">Признаки</text><text x="46.0" y="238.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">пористость породы, %;</text><text x="46.0" y="276.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">проницаемость породы, мкм²</text><polygon points="304.0,308 336.0,308 320.0,330" fill="#8A96A3"/><rect x="24" y="338" width="592" height="184" rx="12" fill="#0F1419" stroke="#3498DB" stroke-width="3"/><text x="46.0" y="380.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="700" fill="#3498DB" text-anchor="start">Правило</text><text x="46.0" y="422.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Пористость более 6 % и</text><text x="46.0" y="460.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">проницаемость более 0,0001 мкм²</text><text x="46.0" y="498.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">— коллектор, иначе неколлектор.</text><polygon points="304.0,530 336.0,530 320.0,552" fill="#8A96A3"/><rect x="24" y="560" width="592" height="184" rx="12" fill="#0F1419" stroke="#2ECC71" stroke-width="3"/><text x="46.0" y="602.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="700" fill="#2ECC71" text-anchor="start">Вывод</text><text x="46.0" y="644.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Порода отнесена к коллекторам</text><text x="46.0" y="682.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">или неколлекторам на разрезе</text><text x="46.0" y="720.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">рифа Шуртан.</text><rect x="24" y="760" width="592" height="146" rx="12" fill="#0F1419" stroke="#E74C3C" stroke-width="3"/><text x="46.0" y="802.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="700" fill="#E74C3C" text-anchor="start">Но бывает иначе</text><text x="46.0" y="844.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Одного признака мало: оба порога</text><text x="46.0" y="882.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">должны выполняться вместе.</text><text x="24.0" y="940.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="400" fill="#8A96A3" text-anchor="start">стр. 209, 211</text></svg>