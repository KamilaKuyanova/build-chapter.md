<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Шуртан: коллектор движется вслед за гребнем</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В асимметричных рифовых</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">системах распределение</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллекторов в пространстве</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">также связано с фациальной</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">зональностью. Поэтому оно</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">асимметрично. Зоны улучшенных</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">свойств могут отчётливо</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">смещаться. Это связано с</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">последовательным смещением во</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">времени биогермного…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">На рис. 10.5 показаны профиль</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">фаций (а) и распределение</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллекторов (б) [Ильин,</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Фортунатова, 1988]. К</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллекторам отнесены породы с</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пористостью более 6 % и</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">проницаемостью более 0,0001</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">мкм². Остальные показаны как</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">породы-неколлекторы. Квадратный</text><text x="474.6666666666667" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">микрометр,…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Породе нужно выполнить оба</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">условия: и по пористости, и по</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">проницаемости. Одного из них</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">для отнесения к коллекторам на</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">рис. 10.5 недостаточно.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 209, 211</text></svg>