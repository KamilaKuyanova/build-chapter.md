<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Тенгиз: пористость лежит кольцом</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Типичное для атолловидных рифов</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">распределение коллекторов</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">установлено в</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нижнекаменноугольном рифе</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Тенгиз в Прикаспийской впадине</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">(рис. 10.4). Пористость пород</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">кольцевого рифового гребня</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">составляет 6–18 %. На</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">бассейновых склонах она равна</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">2–5 %. Промежуточные…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">На рис. 10.4 две схемы: «а» —</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">фациальная карта атолловидного</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">рифа, «б» — карта пористости.</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">На них обозначены фации</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">центральной лагуны и дальних</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">склонов, линии профилей,</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">поглощающие скважины. Есть</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">изолинии пористости, скважины с</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">номером и значением</text><text x="474.6666666666667" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пористости,…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Диапазоны гребня и лагуны</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">перекрываются: 6–18 % и 4,5–9,5</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">%. По одному значению</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пористости, например между 6 и</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">9,5 %, зону не определить.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 207, 209, 210</text></svg>