<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">На какие группы делят ловушки рифа</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Рифы образуют локальные</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">положительные формы рельефа, то</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">есть выступы дна. Поэтому</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">рифовые ловушки — один из видов</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">палеогеоморфологических</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ловушек.</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Палеогеоморфологическая ловушка</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">создана древним рельефом. На</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">формирование замкнутого объёма</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">кроме рельефа часто…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">На рис. 10.9 для каждого типа</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">названы примеры. Для</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">изолированных куполовидных</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">рифов это Надеждино D₃f,</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Чермасан D₃f, Южный Умет P₁,</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Памук J₃, Погромное C₁v. Для</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">асимметричных систем —</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Кунакбаево P₁, Западно-Тепловка</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">P₁, Командашор D₃f, Западно-</text><text x="474.6666666666667" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Тишковское…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В тексте названы четыре группы,</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">а на рис. 10.9 пять строк.</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Пятая строка — структурные</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ловушки с рифовым резервуаром,</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">их автор дальше описывает</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">отдельной группой.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 216, 217, 218, 219</text></svg>