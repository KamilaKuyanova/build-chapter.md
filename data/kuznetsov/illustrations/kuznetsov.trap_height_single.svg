<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 866" width="640" height="866" style="max-width:100%;height:auto"><rect width="640" height="866" rx="14" fill="#1A2129"/><rect x="24" y="22" width="115" height="44" rx="8" fill="#8E44AD"/><text x="39.0" y="54.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="start">схема</text><text x="24.0" y="108.0" font-family="Segoe UI,system-ui,sans-serif" font-size="34" font-weight="700" fill="#ECEFF4" text-anchor="start">Место шага в главе</text><text x="24.0" y="162.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="400" fill="#8A96A3" text-anchor="start">опирается на</text><rect x="24" y="178" width="592" height="104" rx="12" fill="#0F1419" stroke="#3498DB" stroke-width="3"/><text x="46.0" y="220.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">На какие группы делят ловушки</text><text x="46.0" y="258.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">рифа</text><polygon points="304.0,290 336.0,290 320.0,312" fill="#8A96A3"/><rect x="24" y="320" width="592" height="104" rx="12" fill="#F1C40F" stroke="#F1C40F" stroke-width="3"/><text x="46.0" y="362.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="700" fill="#0F1419" text-anchor="start">От чего зависит высота ловушки</text><text x="46.0" y="400.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="700" fill="#0F1419" text-anchor="start">рифа</text><polygon points="304.0,432 336.0,432 320.0,454" fill="#8A96A3"/><text x="24.0" y="480.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="400" fill="#8A96A3" text-anchor="start">ведёт к</text><rect x="24" y="496" width="592" height="104" rx="12" fill="#0F1419" stroke="#2ECC71" stroke-width="3"/><text x="46.0" y="538.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Почему ловушка цепочки рифов</text><text x="46.0" y="576.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">низкая</text><rect x="24" y="612" width="592" height="104" rx="12" fill="#0F1419" stroke="#2ECC71" stroke-width="3"/><text x="46.0" y="654.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Когда складка поднимает готовый</text><text x="46.0" y="692.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">риф</text><rect x="24" y="728" width="592" height="66" rx="12" fill="#0F1419" stroke="#2ECC71" stroke-width="3"/><text x="46.0" y="770.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Какой высоты может быть залежь</text><text x="24.0" y="840.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="400" fill="#8A96A3" text-anchor="start">построено из связей шагов · стр. 218</text></svg>