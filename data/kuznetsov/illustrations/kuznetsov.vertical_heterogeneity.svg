<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Большой риф не однородная глыба</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Кроме латеральных изменений в</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">рифовом резервуаре есть и</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">значительная вертикальная</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">неоднородность. Латеральный —</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">значит по площади, вбок. Давно</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сложилось и до сих пор бытует</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">мнение об однородном массивном</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разрезе рифа. По нему и</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллекторские свойства…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Последнее, массивность в первом</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">приближении, особенно касается</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">биогермов и рифов, небольших по</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">мощности и времени</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">формирования. Так установлено,</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">например, на Большетирской</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">площади Восточной Сибири (рис.</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">10.6). На рис. 10.6 показаны</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">профильные разрезы рифа…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">«Можно считать массивным» автор</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">говорит только о первом</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">приближении. Для мощных и долго</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">росших рифов такого приближения</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">мало.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 209, 212</text></svg>