<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Почему равномерная сетка скважин не годится</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Абсолютное большинство</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">связанных с рифами залежей</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">относится к массивному типу.</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Залежь ограничена сверху</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">выпуклой поверхностью ловушки.</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Снизу её ограничивает плоскость</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ВНК или ГВК. ГВК — газоводяной</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">контакт, граница газа и воды. В</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">связи с такой формой мощность…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Методика должна учитывать эту</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">форму. Речь о работах по</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">изучению подсчётных параметров</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">и подготовке месторождения к</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разработке. Подсчётные</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">параметры нужны, чтобы</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">вычислить запасы. Исходят из</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">предположения: выгоднее сетка,</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">которая освещала бы равномерно</text><text x="474.6666666666667" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">объём,…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Вывод опирается на</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">предположение, что выгоднее</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">равномерно освещать объём.</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Автор так и пишет: «если</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">исходить из предположения».</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 221, 222</text></svg>