<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Какую схему скважин выбрать</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Для небольших куполовидных</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">рифов часто нерентабельно</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">планировать специальную сетку</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">скважин. Нерентабельно — значит</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">не окупается. Нередко</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">достаточно пробурить с одного</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">основания дополнительно</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">несколько стволов. Отклонения</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">от забоев — 400–500 м. Забой —</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">дно…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">На рис. 10.8 три системы</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разведки: многоствольная,</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">кольцевая и профильная.</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Номерами на схемах обозначена</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">предлагаемая очередность</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">бурения скважин.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Отказ от сетки для малых</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">куполов не правило: «часто</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нерентабельно», «нередко</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">достаточно». И площадь до 1 км²</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">куст осветить может, а не</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">обязан.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 214, 215, 222</text></svg>