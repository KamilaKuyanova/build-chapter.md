<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1468" width="640" height="1468" style="max-width:100%;height:auto" role="img" aria-label="Пять убывающих кривых: по горизонтали пористость, по вертикали остаточная водонасыщенность; горизонтальная линия на 70 %" font-family="Segoe UI, sans-serif"><rect width="640" height="1468" fill="#0F1419"/><rect x="20" y="18" width="115" height="44" rx="8" fill="#8E44AD"/><text x="35" y="50" font-size="29" font-weight="600" fill="#FFFFFF">схема</text><text x="20" y="104" font-size="34" font-weight="700" fill="#ECEFF4">Остаточная водонасыщенность</text><text x="20" y="146" font-size="34" font-weight="700" fill="#ECEFF4">kв.св = f(kп) для карбонатных</text><text x="20" y="188" font-size="34" font-weight="700" fill="#ECEFF4">коллекторов</text><text x="20" y="230" font-size="29" fill="#8A96A3">перерисовано по рис. 77, стр. 107</text><text x="20" y="266" font-size="29" fill="#8A96A3">(Латышова, 1991); кривые оцифрованы</text><text x="20" y="302" font-size="29" fill="#8A96A3">по скану</text><rect x="20" y="326" width="34" height="24" fill="#F0A35E" fill-opacity="0.6"/><text x="68" y="346" font-size="29" fill="#ECEFF4">1 — крупнопористые рифовые</text><text x="68" y="382" font-size="29" fill="#ECEFF4">(Башкирия)</text><rect x="20" y="398" width="34" height="24" fill="#7FB3D5" fill-opacity="0.6"/><text x="68" y="418" font-size="29" fill="#ECEFF4">2 — крупнопористые коллекторы</text><text x="68" y="454" font-size="29" fill="#ECEFF4">карбона (Башкирия)</text><rect x="20" y="470" width="34" height="24" fill="#2ECC71" fill-opacity="0.6"/><text x="68" y="490" font-size="29" fill="#ECEFF4">3 — известняки (Вуктыл)</text><rect x="20" y="506" width="34" height="24" fill="#A98FD1" fill-opacity="0.6"/><text x="68" y="526" font-size="29" fill="#ECEFF4">4 — доломиты межсолевых отложений</text><text x="68" y="562" font-size="29" fill="#ECEFF4">девона (Белоруссия)</text><rect x="20" y="578" width="34" height="24" fill="#E8C872" fill-opacity="0.6"/><text x="68" y="598" font-size="29" fill="#ECEFF4">5 — поровые коллекторы перми</text><text x="68" y="634" font-size="29" fill="#ECEFF4">(Оренбург)</text><rect x="74" y="726" width="536" height="492" fill="#1A2129" stroke="#8A96A3"/><line x1="74.0" y1="1218" x2="74.0" y2="1226" stroke="#8A96A3"/><text x="74.0" y="1256" font-size="29" fill="#8A96A3" text-anchor="middle">0</text><line x1="163.3" y1="1218" x2="163.3" y2="1226" stroke="#8A96A3"/><text x="163.3" y="1256" font-size="29" fill="#8A96A3" text-anchor="middle">5</text><line x1="252.7" y1="1218" x2="252.7" y2="1226" stroke="#8A96A3"/><text x="252.7" y="1256" font-size="29" fill="#8A96A3" text-anchor="middle">10</text><line x1="342.0" y1="1218" x2="342.0" y2="1226" stroke="#8A96A3"/><text x="342.0" y="1256" font-size="29" fill="#8A96A3" text-anchor="middle">15</text><line x1="431.3" y1="1218" x2="431.3" y2="1226" stroke="#8A96A3"/><text x="431.3" y="1256" font-size="29" fill="#8A96A3" text-anchor="middle">20</text><line x1="520.7" y1="1218" x2="520.7" y2="1226" stroke="#8A96A3"/><text x="520.7" y="1256" font-size="29" fill="#8A96A3" text-anchor="middle">25</text><line x1="610.0" y1="1218" x2="610.0" y2="1226" stroke="#8A96A3"/><text x="610.0" y="1256" font-size="29" fill="#8A96A3" text-anchor="middle">30</text><line x1="66" y1="1218.0" x2="610" y2="1218.0" stroke="#8A96A3" stroke-opacity="0.25"/><text x="64" y="1228.0" font-size="29" fill="#8A96A3" text-anchor="end">0</text><line x1="66" y1="1119.6" x2="610" y2="1119.6" stroke="#8A96A3" stroke-opacity="0.25"/><text x="64" y="1129.6" font-size="29" fill="#8A96A3" text-anchor="end">20</text><line x1="66" y1="1021.2" x2="610" y2="1021.2" stroke="#8A96A3" stroke-opacity="0.25"/><text x="64" y="1031.2" font-size="29" fill="#8A96A3" text-anchor="end">40</text><line x1="66" y1="922.8" x2="610" y2="922.8" stroke="#8A96A3" stroke-opacity="0.25"/><text x="64" y="932.8" font-size="29" fill="#8A96A3" text-anchor="end">60</text><line x1="66" y1="824.4" x2="610" y2="824.4" stroke="#8A96A3" stroke-opacity="0.25"/><text x="64" y="834.4" font-size="29" fill="#8A96A3" text-anchor="end">80</text><line x1="66" y1="726.0" x2="610" y2="726.0" stroke="#8A96A3" stroke-opacity="0.25"/><text x="64" y="736.0" font-size="29" fill="#8A96A3" text-anchor="end">100</text><text x="610" y="1296" font-size="29" fill="#ECEFF4" text-anchor="end">kп, %</text><text x="12" y="706" font-size="29" fill="#ECEFF4">kв.св, %</text><line x1="74.0" y1="873.6" x2="610.0" y2="873.6" stroke="#8A96A3" stroke-width="2.5" stroke-dasharray="14 9"/><text x="82.0" y="865.6" font-size="29" font-weight="400" fill="#ECEFF4" stroke="#0F1419" stroke-width="6" stroke-linejoin="round" paint-order="stroke">kв.св = 70 % (пример 55)</text><polyline points="90.1,893.3 100.8,942.5 115.1,1001.5 133.0,1060.6 154.4,1095.0 190.1,1134.4 234.8,1163.9 288.4,1178.6 342.0,1186.0 431.3,1193.4 502.8,1195.9" fill="none" stroke="#F0A35E" stroke-width="4" stroke-linejoin="round" stroke-dasharray="14 9"/><polyline points="129.4,735.8 133.0,824.4 138.3,913.0 149.0,996.6 172.3,1065.5 220.5,1119.6 270.5,1146.7 309.8,1159.0 395.6,1173.7 502.8,1189.5 601.1,1195.9" fill="none" stroke="#7FB3D5" stroke-width="4" stroke-linejoin="round"/><polyline points="118.7,780.1 149.0,858.8 172.3,903.1 204.4,942.5 250.9,1001.5 306.3,1060.6 359.9,1112.2 427.8,1156.0" fill="none" stroke="#2ECC71" stroke-width="4" stroke-linejoin="round"/><polyline points="183.0,750.6 216.9,819.5 258.0,913.0 313.4,986.8 374.2,1040.9 431.3,1080.2" fill="none" stroke="#A98FD1" stroke-width="4" stroke-linejoin="round" stroke-dasharray="18 7 4 7"/><polyline points="268.7,750.6 313.4,831.8 352.7,888.4 408.1,942.5 463.5,972.0 517.1,1013.8" fill="none" stroke="#E8C872" stroke-width="4" stroke-linejoin="round" stroke-dasharray="14 9"/><text x="187.2" y="1138.2" font-size="29" font-weight="700" fill="#F0A35E" stroke="#0F1419" stroke-width="6" stroke-linejoin="round" paint-order="stroke">1</text><text x="237.2" y="1103.8" font-size="29" font-weight="70