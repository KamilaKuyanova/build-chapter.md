<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Почему у глинистого пласта свои пороги</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Для коллекторов с разной</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пористостью, проницаемостью и</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">глинистостью зависимости нужны</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">для каждого класса. Получается</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">семейство графиков при</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">различной глинистости. Его</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пример дан на рис. 7, б.</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Каждому графику семейства</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">соответствуют свои характерные</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">значения…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Для чистого коллектора</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">достаточно знать сопротивление</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">и пористость. Для глинистого</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нужен ещё геофизический</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">параметр глинистости, например</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">относительная амплитуда СП. Это</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">амплитуда СП в доле от</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">наибольшей в разрезе. Значения</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">критерия в таблице установлены</text><text x="474.6666666666667" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">для…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">По таблице 22 первый порог</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">параметра насыщения снижается с</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">глинистостью: 10 при амплитуде</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">1,0 и 2,1 при 0,7. Первый порог</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">водонасыщения при этом растёт:</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">30 и 50.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 100</text></svg>