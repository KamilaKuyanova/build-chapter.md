<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Почему набор методов выбирают заново</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В каждом районе</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">применяют оптимальный</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">комплекс исследований,</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">соответствующий его</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">условиям. Учитывают и</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">изучаемый геологический</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">объект. Состав комплекса</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">зависит от особенностей</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разреза: терригенный,</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">карбонатный…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Промывочных жидкостей</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">три группы: глинистые</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">растворы, техническая</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">вода и нефильтрующиеся</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">растворы. Глинистый</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">раствор в книге назван</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">наиболее широко</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">применяемым. Поэтому</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">основные признаки пород</text><text x="474.6666666666667" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">и коллекторов…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Если скважину бурили на</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">другой жидкости,</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">признаки, рассчитанные на</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">глинистый раствор, нельзя</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">переносить без проверки:</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">от условий бурения</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">зависят и методы, и</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">способы интерпретации.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 90</text></svg>