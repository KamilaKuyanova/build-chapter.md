<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Почему граница коллектора зависит от экономики</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Кроме прямых признаков есть</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">косвенные количественные. Это</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">критические значения</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">проницаемости, пористости,</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">глинистости. К ним относят и</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">геофизические параметры,</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">которые отражают изменение</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пористости и проницаемости.</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Основной критерий — граничное,</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">или…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Рентабельным считают дебит</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нефти или газа выше нижнего</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">предела для района. Предел</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">определяют геология и экономика</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">района и себестоимость тонны</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нефти или кубометра газа.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Для нефтеносных коллекторов</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">критическая проницаемость</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">больше, чем для газовых: в</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">главе (1-10) и (0,1-1) с одним</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">и тем же множителем. Степень</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">десяти в множителе похожа на</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ошибку распознавания, её надо</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сверить со сканом.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 96</text></svg>