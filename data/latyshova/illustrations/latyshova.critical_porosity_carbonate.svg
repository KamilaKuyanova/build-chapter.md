<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Почему у известняков нет единого порога</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">При выделении коллекторов по</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">критической пористости</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">учитывают структуру порового</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пространства. От неё порог</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">изменяется в широких пределах.</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Это показывают зависимости</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">связанной воды от пористости</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">для разных типов коллекторов на</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">рис. 77. По таким зависимостям…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Для большинства межзерновых</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">карбонатных коллекторов</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">крупнейших месторождений СССР</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">типичное значение заключено в</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пределах 6-8 %. На рисунке 77</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">даны кривые для пяти типов</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллекторов. Это рифовые</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">отложения и коллекторы карбона</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Башкирии, известняки Вуктыла,…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Правильный выбор порога</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">обеспечивает надёжную</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">эффективную толщину. Порог, не</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">соответствующий отложениям,</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">приводит к серьёзным</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">погрешностям. Нормализация и</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">критическая пористость</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">эффективны не только в</text><text x="889.3333333333334" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">карбонатном, но и в</text><text x="889.3333333333334" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">низкопористом слабоглинистом…</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 107, 108</text></svg>