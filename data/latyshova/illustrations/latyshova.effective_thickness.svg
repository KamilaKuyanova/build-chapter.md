<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 902" width="640" height="902" style="max-width:100%;height:auto"><rect width="640" height="902" rx="14" fill="#1A2129"/><rect x="24" y="22" width="115" height="44" rx="8" fill="#8E44AD"/><text x="39.0" y="54.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="start">схема</text><text x="24.0" y="108.0" font-family="Segoe UI,system-ui,sans-serif" font-size="34" font-weight="700" fill="#ECEFF4" text-anchor="start">Место шага в главе</text><text x="24.0" y="162.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="400" fill="#8A96A3" text-anchor="start">опирается на</text><rect x="24" y="178" width="592" height="66" rx="12" fill="#0F1419" stroke="#3498DB" stroke-width="3"/><text x="46.0" y="220.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Где граница между нефтью и водой</text><rect x="24" y="256" width="592" height="66" rx="12" fill="#0F1419" stroke="#3498DB" stroke-width="3"/><text x="46.0" y="298.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Как от дебита перейти к порогу</text><polygon points="304.0,330 336.0,330 320.0,352" fill="#8A96A3"/><rect x="24" y="360" width="592" height="66" rx="12" fill="#F1C40F" stroke="#F1C40F" stroke-width="3"/><text x="46.0" y="402.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="700" fill="#0F1419" text-anchor="start">Какая часть пласта отдаст нефть</text><polygon points="304.0,434 336.0,434 320.0,456" fill="#8A96A3"/><text x="24.0" y="482.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="400" fill="#8A96A3" text-anchor="start">ведёт к</text><rect x="24" y="498" width="592" height="104" rx="12" fill="#0F1419" stroke="#2ECC71" stroke-width="3"/><text x="46.0" y="540.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Где провести границу нефти и</text><text x="46.0" y="578.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">воды</text><rect x="24" y="614" width="592" height="66" rx="12" fill="#0F1419" stroke="#2ECC71" stroke-width="3"/><text x="46.0" y="656.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Как найти границу газа и нефти</text><rect x="24" y="692" width="592" height="104" rx="12" fill="#0F1419" stroke="#2ECC71" stroke-width="3"/><text x="46.0" y="734.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Какие прослои надо вычесть из</text><text x="46.0" y="772.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">пласта</text><text x="24.0" y="842.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="400" fill="#8A96A3" text-anchor="start">построено из связей шагов · стр. 100,</text><text x="24.0" y="876.0" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="400" fill="#8A96A3" text-anchor="start">101</text></svg>