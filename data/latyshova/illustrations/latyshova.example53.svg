<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Шесть пластов и шесть разных ответов</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="578.0" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Для каждой пары значений</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">находят точку на рис. 7, б.</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Ответ даёт область I, II или</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">III, к которой принадлежит</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">точка.</text><polygon points="627.0,387 653.0,405 627.0,423" fill="#8A96A3"/><rect x="662.0" y="170" width="578.0" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="682.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="682.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Параметр насыщения 3 даёт</text><text x="682.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">предельно нефтенасыщенный</text><text x="682.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллектор при амплитуде СП 0,7.</text><text x="682.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">При амплитуде 0,9 тот же</text><text x="682.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">параметр даёт нефть с водой.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 100</text></svg>