<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Сколько метров нефти в известняке</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Сравнивают кривые БК-3 и НГМ, а</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">также индукционного метода и</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">НГМ, приведённые к единому</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">масштабу пористости. Верхняя</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">часть разреза продуктивна,</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нижняя водоносна. Границу ВНК</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">проводят на глубине 1083 м. Ей</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">соответствует критический</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">параметр насыщения около…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Общая толщина продуктивных</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">отложений 13,5 м. В интервале</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">1069,5 - 1083 м учитывают</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">прослои плотных неколлекторов.</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Их выделяют по микрозондам, а в</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">отдельных случаях по сближению</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нормализованных кривых НГМ и</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">БК-3. После вычета остаётся 9</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">м.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ВНК здесь зависит от допущения</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">о близости показаний</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">индукционного метода к</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сопротивлению пласта.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 107</text></svg>