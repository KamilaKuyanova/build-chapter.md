<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Какие задачи решает каротаж скважины</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Геофизические</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">исследования скважин</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">(ГИС) ведут в поисковых,</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разведочных и</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">эксплуатационных</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">скважинах на нефть и газ.</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">По ним составляют</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">литологический разрез, то</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">есть последовательность</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пород. По ним же…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Для простейшего случая,</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллекторов с</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">межзерновой</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пористостью, качественной</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">интерпретации тоже</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">достаточно. Так выделяют</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллектор, оценивают его</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">насыщение и эффективную</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">толщину. Для более</text><text x="474.6666666666667" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сложных коллекторов…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В эксплуатационных</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">скважинах по геофизике</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">следят ещё и за</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">движением контактов при</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разработке. Это</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">водонефтяной контакт</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">(ВНК) и газожидкостный</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">контакт (ГЖК).</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 90</text></svg>