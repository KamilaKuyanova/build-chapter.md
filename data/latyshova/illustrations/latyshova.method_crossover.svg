<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Почему методы подсказывают больше, чем обещают</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Сфера применения каждого метода</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">шире, чем в классификации по</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">группам. Диаграмма ЯМР в</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">терригенном и карбонатном</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разрезах несёт информацию о</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пористости. Диаграммы СП и ГМ</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">несут её в терригенном разрезе.</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Методы пористости ГГМ, НМ, АК</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">содержат сведения о…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">При глубоких проникновениях</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нейтронные методы повторяют</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">после обсадки скважины. По мере</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">расформирования зоны</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">проникновения это позволяет</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">найти газонасыщенные интервалы.</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Расформирование — постепенное</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">исчезновение зоны</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">проникновения.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">При неглубоком проникновении</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">микрозонды дают сведения о</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">продуктивности. Диаграммы ГГМ и</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">НМ тогда дают сведения о</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">газонасыщенности породы. Для</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">надёжного литологического</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разреза нужны оптимальные</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">параметры промывочной жидкости</text><text x="889.3333333333334" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">и репрессий. Нужен и полный…</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 92</text></svg>