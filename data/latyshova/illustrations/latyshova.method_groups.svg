<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Какой метод на какой вопрос отвечает</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Методы стандартного комплекса</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">различны по физической</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сущности. По решаемым задачам</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">их делят на четыре группы:</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">выделение межзерновых</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллекторов, пористость,</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">глинистость, оценка</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">продуктивности. Первая группа —</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">микрозонды и каверномер. Они</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">находят фильтрующие…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Методы пористости — гамма-</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">гамма-метод, акустический и</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нейтронные. Они в одинаковой</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">степени применимы на глинистом</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">растворе, технической воде и</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нефильтрующихся растворах.</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Методы глинистости — метод</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">собственных потенциалов (СП) и</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">метод естественной…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Микрозонды и каверномер ищут</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">глинистую корку, поэтому их</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">роль связана с бурением на</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">глинистом растворе. Методы</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пористости от вида раствора</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">зависят меньше: они в</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">одинаковой степени применимы на</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">трёх видах раствора.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 91</text></svg>