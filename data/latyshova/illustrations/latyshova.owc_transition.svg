<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Где провести границу нефти и воды</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Шаг 1. По большим зондам БЭЗ</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">или индукционному зонду находят</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">кровлю и подошву переходной</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">зоны. Кровля — нижняя граница</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">зоны предельного</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">нефтегазонасыщения. Подошва —</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">зеркало воды. Шаг 2.</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Устанавливают удельные</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сопротивления зоны предельного</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">насыщения и…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Критические значения для</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">объекта должны быть установлены</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">заранее одним из рассмотренных</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">способов.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Критерий выбирают: от него</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">зависит глубина ВНК. При</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">подсчёте запасов берут критерий</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">промышленного притока. Тогда</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">при испытании выше ВНК получают</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">промышленный приток нефти с</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">некоторым количеством воды.</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Линейный закон — допущение, его</text><text x="889.3333333333334" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">именно полагают.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 101</text></svg>