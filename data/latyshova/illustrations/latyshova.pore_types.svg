<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Чем отличаются пустоты в породах</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">По морфологии, то есть по форме</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">порового пространства,</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллекторы делят на</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">межзерновые, трещинные,</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">кавернозно-трещинные и</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">смешанные. У межзерновых</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пустоты лежат между зёрнами, у</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">трещинных — в трещинах. Каверны</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">— более крупные полости. Среди</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">смешанных выделяют…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В терригенном разрезе</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">преобладают межзерновые</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллекторы. В карбонатном</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">наряду с ними есть кавернозно-</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">трещинные и смешанные.</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Трещинные коллекторы</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">встречаются в карбонатных,</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">терригенных и вулканогенных</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">породах.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Тип разреза не задаёт тип</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пустот однозначно: трещинные</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллекторы встречаются в трёх</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">видах пород.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 91</text></svg>