<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1080" width="640" height="1080" style="max-width:100%;height:auto"><rect width="640" height="1080" rx="14" fill="#1A2129"/><rect x="24" y="22" width="115" height="44" rx="8" fill="#8E44AD"/><text x="39.0" y="54.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="600" fill="#FFFFFF" text-anchor="start">схема</text><text x="24.0" y="108.0" font-family="Segoe UI,system-ui,sans-serif" font-size="34" font-weight="700" fill="#ECEFF4" text-anchor="start">Решение на данных</text><rect x="24" y="154" width="592" height="184" rx="12" fill="#0F1419" stroke="#F1C40F" stroke-width="3"/><text x="46.0" y="196.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="700" fill="#F1C40F" text-anchor="start">Признаки</text><text x="46.0" y="238.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">сопротивление; СП; диаметр</text><text x="46.0" y="276.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">скважины; микрозонды;</text><text x="46.0" y="314.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">гамма-метод; нейтронные методы</text><polygon points="304.0,346 336.0,346 320.0,368" fill="#8A96A3"/><rect x="24" y="376" width="592" height="222" rx="12" fill="#0F1419" stroke="#3498DB" stroke-width="3"/><text x="46.0" y="418.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="700" fill="#3498DB" text-anchor="start">Правило</text><text x="46.0" y="460.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Сравнить набор показаний</text><text x="46.0" y="498.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">интервала со строками таблицы и</text><text x="46.0" y="536.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">выбрать породу, у которой</text><text x="46.0" y="574.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">совпало больше всего признаков.</text><polygon points="304.0,606 336.0,606 320.0,628" fill="#8A96A3"/><rect x="24" y="636" width="592" height="184" rx="12" fill="#0F1419" stroke="#2ECC71" stroke-width="3"/><text x="46.0" y="678.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="700" fill="#2ECC71" text-anchor="start">Вывод</text><text x="46.0" y="720.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Порода определяется по сумме</text><text x="46.0" y="758.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">признаков, а не по одному</text><text x="46.0" y="796.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">методу.</text><rect x="24" y="836" width="592" height="184" rx="12" fill="#0F1419" stroke="#E74C3C" stroke-width="3"/><text x="46.0" y="878.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="700" fill="#E74C3C" text-anchor="start">Но бывает иначе</text><text x="46.0" y="920.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Гипсы и ангидриты совпадают</text><text x="46.0" y="958.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">почти по всем методам, их</text><text x="46.0" y="996.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">различают нейтронные.</text><text x="24.0" y="1054.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="400" fill="#8A96A3" text-anchor="start">стр. 92, 93, 94</text></svg>