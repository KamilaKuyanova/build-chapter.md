<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">По каким признакам узнают породу</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Для самых распространённых</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">осадочных пород есть</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ориентировочные признаки, они</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">собраны в таблице 21. Таблица</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">составлена для глинистого</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">раствора. Глины: сопротивление</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">низкое, проникновения нет, СП</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">максимальная, диаметр больше</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">номинального. Микрозонды низкие</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">и…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Коллекторы с водой более</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пресной, чем фильтрат, или</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">такой же: сопротивление</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">среднее, а показания СП выше,</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">чем в глинах, или такие же.</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Диаметр номинальный.</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Низкопористые коллекторы в</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">чистых карбонатах отличает</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">глубокое проникновение.</text><text x="474.6666666666667" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Характер насыщения их пор…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В таблице даны только наиболее</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ясно выраженные типы пород и</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллекторы межзернового типа. В</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">природе встречаются и</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">переходные разности.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 92, 93, 94</text></svg>