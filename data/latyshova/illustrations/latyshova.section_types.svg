<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Какие бывают разрезы скважин</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="578.0" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Основными типами разреза</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">считают терригенный,</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">карбонатный и гидрохимический.</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Кроме них встречаются смешанные</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разрезы: терригенно-</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">карбонатные, карбонатно-</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">гидрохимические, терригенно-</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">гидрохимические и</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">вулканогенные. Вулканогенный</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разрез сложен породами,…</text><polygon points="627.0,387 653.0,405 627.0,423" fill="#8A96A3"/><rect x="662.0" y="170" width="578.0" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="682.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="682.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Вулканогенные разрезы</text><text x="682.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">двойственны. По вещественному</text><text x="682.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">составу они близки к</text><text x="682.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">терригенным. По структуре</text><text x="682.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">порового пространства</text><text x="682.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллекторов они близки к</text><text x="682.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">карбонатным, за исключением</text><text x="682.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">карстовых образований.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 91</text></svg>