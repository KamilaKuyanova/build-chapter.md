<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Когда признаки коллектора исчезают</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">С ростом водоотдачи корка на</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллекторе растёт. В хороших</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">условиях она не больше 1 см,</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">при плохом растворе достигает</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">3-4 см. Разница в показаниях</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">микрозондов при этом сначала</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">возрастает, а потом убывает.</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Толстая корка исключает</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">исследование промытой зоны…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">При росте минерализации</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">раствора корки на коллекторах</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">образуются. Но качественные</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">диаграммы микрозондов</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">практически не получаются.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">На технической воде признаки на</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">микрозондах и кавернограммах</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">обычно отсутствуют. Слабые</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">признаки появляются, лишь если</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">вода значительно обогатилась</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">глиной из выбуренных пород.</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Кавернограмма — диаграмма</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">диаметра скважины.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 96</text></svg>