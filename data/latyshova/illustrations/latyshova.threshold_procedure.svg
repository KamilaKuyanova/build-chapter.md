<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Как от дебита перейти к порогу</text><text x="1240" y="696" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Шаг 1. По минимальному</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">рентабельному дебиту</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">находят коэффициент</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">продуктивности</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллектора. Его делят на</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">депрессию и эффективную</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">толщину. Депрессия —</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">перепад давления, при</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">котором получен дебит.</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Эффективная толщина —…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Дальше есть два пути:</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">методы пористости или</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">методы глинистости. Шаг 3.</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">По корреляционным</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">связям находят</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">критическую пористость</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">либо глинистость,</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">соответствующую</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">критической</text><text x="474.6666666666667" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">проницаемости. Шаг 4. П…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">В терригенном разрезе, где</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пористость и</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">проницаемость зависят от</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">глинистости, берут данные</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">СП и ГМ. Если в таком</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разрезе есть пласты с</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">неактивным силикатным</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">или карбонатным</text><text x="889.3333333333334" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">цементом, необходимы</text><text x="889.3333333333334" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">методы пористости. Для…</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 96, 97</text></svg>