<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Почему природа не вписывается в таблицу</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Увеличение песчанистости глины</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">может уменьшить её пористость и</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">вероятность каверны против неё.</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Сопротивление при этом может</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">вырасти. Увеличение</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пластичности глины может</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">привести к обратному признаку</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">по диаметру: вместо каверны</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">против глины создаётся сужение…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Загипсованность пород уменьшает</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">показания НГМ — нейтронного</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">гамма-метода.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Если глинистого материала</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">много, могут резко измениться</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">показания и других методов.</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Тогда такой коллектор трудно</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">выделить. Всё это в</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">значительной степени затрудняет</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">построение разреза.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 92, 95</text></svg>