<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Когда в пачке два вида помех</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Если в пачке тонкие прослои</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">двух типов, среднее</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сопротивление связано с</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сопротивлениями коллектора,</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">глины и плотной породы</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">уравнением (65). Типы —</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">глинистые и плотные с</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">неактивным цементом.</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Сопротивление плотных прослоев</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">обычно соизмеримо с…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Возможных путей учёта три.</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Первый — выделить плотные</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">прослои и посчитать их толщину</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">микроэлектрическими методами.</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Второй — объединить методы</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">сопротивления и собственных</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">потенциалов с методами</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">пористости. Третий — взять их</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">содержание по представительному</text><text x="474.6666666666667" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">керну.</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Если плотные прослои не учесть,</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">они останутся в эффективной</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">толщине, хотя жидкость не</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">отдают.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 102</text></svg>