<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Почему водоотдача раствора важнее всего</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Проявление особенностей</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">вскрытия зависит от параметров</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">раствора: водоотдачи,</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">плотности, минерализации</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">фильтрата. Водоотдача</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">показывает, сколько жидкости</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">раствор отдаёт в породу. Это</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">основной показатель качества</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">глинистого раствора: чем она</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ниже, тем раствор…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">При оптимальной водоотдаче</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">методы электрометрии надёжно</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">дают параметры неизменённой</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">части коллектора. Коллекторские</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">свойства тогда надёжно дают</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">методы с высокой вертикальной</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разрешающей способностью и</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">малой глубинностью (ГГМ, МБК,</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ЯМР). Глубинность —…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">При высокой водоотдаче глубокое</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">проникновение мешает оценить</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">продуктивность даже наиболее</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">глубинными методами</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">электрометрии. Это индукционный</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">зонд, большие потенциал- и</text><text x="889.3333333333334" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">градиент-зонды. Толстая</text><text x="889.3333333333334" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">глинистая корка делает</text><text x="889.3333333333334" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">коллектор недоступным для</text><text x="889.3333333333334" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">методов с малой…</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 90</text></svg>