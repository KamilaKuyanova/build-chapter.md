<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="max-width:100%;height:auto"><rect width="1280" height="720" fill="#0F1419"/><text x="40" y="64" font-family="Segoe UI" font-size="40" font-weight="700" fill="#ECEFF4">Когда хватает нескольких кривых</text><text x="1240" y="40" text-anchor="end" font-family="Segoe UI" font-size="26" font-weight="700" fill="#8E44AD">схема</text><rect x="40.0" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#2ECC71" stroke-width="3"/><text x="60.0" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#2ECC71">Механизм</text><text x="60.0" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Если породы в разрезе имеют</text><text x="60.0" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">ясно выраженные свойства, в</text><text x="60.0" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">некоторых случаях</text><text x="60.0" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">литологическую колонку вполне</text><text x="60.0" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">удовлетворительно составляют по</text><text x="60.0" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">небольшому числу методов.</text><text x="60.0" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Однако в разрезе могут</text><text x="60.0" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">встретиться и терригенные, и</text><text x="60.0" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">карбонатные породы с разными</text><text x="60.0" y="566" font-family="Segoe UI" font-size="24" fill="#ECEFF4">типами порового…</text><polygon points="419.6666666666667,387 445.6666666666667,405 419.6666666666667,423" fill="#8A96A3"/><rect x="454.6666666666667" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/><text x="474.6666666666667" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#E74C3C">Практика</text><text x="474.6666666666667" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">Пример простого случая —</text><text x="474.6666666666667" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">терригенный разрез, где плотные</text><text x="474.6666666666667" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">слабоглинистые карбонатные</text><text x="474.6666666666667" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">породы имеют подчинённое</text><text x="474.6666666666667" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">значение. Там задача может быть</text><text x="474.6666666666667" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">достаточно хорошо решена одними</text><text x="474.6666666666667" y="464" font-family="Segoe UI" font-size="24" fill="#ECEFF4">лишь электрическими методами. В</text><text x="474.6666666666667" y="498" font-family="Segoe UI" font-size="24" fill="#ECEFF4">гидрохимических отложениях</text><text x="474.6666666666667" y="532" font-family="Segoe UI" font-size="24" fill="#ECEFF4">большую роль играют методы…</text><polygon points="834.3333333333334,387 860.3333333333334,405 834.3333333333334,423" fill="#8A96A3"/><rect x="869.3333333333334" y="170" width="370.6666666666667" height="470" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/><text x="889.3333333333334" y="214" font-family="Segoe UI" font-size="30" font-weight="700" fill="#F1C40F">Нюансы</text><text x="889.3333333333334" y="260" font-family="Segoe UI" font-size="24" fill="#ECEFF4">На рисунке 68 автор показал</text><text x="889.3333333333334" y="294" font-family="Segoe UI" font-size="24" fill="#ECEFF4">комплекс диаграмм по</text><text x="889.3333333333334" y="328" font-family="Segoe UI" font-size="24" fill="#ECEFF4">терригенно-карбонатному</text><text x="889.3333333333334" y="362" font-family="Segoe UI" font-size="24" fill="#ECEFF4">разрезу. Сами кривые в тексте</text><text x="889.3333333333334" y="396" font-family="Segoe UI" font-size="24" fill="#ECEFF4">не описаны, их надо смотреть на</text><text x="889.3333333333334" y="430" font-family="Segoe UI" font-size="24" fill="#ECEFF4">рисунке.</text><text x="40" y="696" font-family="Segoe UI" font-size="24" fill="#8A96A3">по тексту главы · стр. 95</text></svg>