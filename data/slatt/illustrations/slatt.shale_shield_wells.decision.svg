<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 966" width="640" height="966" style="max-width:100%;height:auto"><rect width="640" height="966" rx="14" fill="#1A2129"/><rect x="24" y="22" width="115" height="44" rx="8" fill="#8E44AD"/><text x="39.0" y="54.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="600" fill="#FFFFFF" text-anchor="start">схема</text><text x="24.0" y="108.0" font-family="Segoe UI,system-ui,sans-serif" font-size="34" font-weight="700" fill="#ECEFF4" text-anchor="start">Решение на данных</text><rect x="24" y="154" width="592" height="222" rx="12" fill="#0F1419" stroke="#F1C40F" stroke-width="3"/><text x="46.0" y="196.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="700" fill="#F1C40F" text-anchor="start">Признаки</text><text x="46.0" y="238.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">рост воды в добыче;</text><text x="46.0" y="276.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">закартированная экранирующая</text><text x="46.0" y="314.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">глина; дельтовый песчаник под</text><text x="46.0" y="352.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">глиной</text><polygon points="304.0,384 336.0,384 320.0,406" fill="#8A96A3"/><rect x="24" y="414" width="592" height="146" rx="12" fill="#0F1419" stroke="#3498DB" stroke-width="3"/><text x="46.0" y="456.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="700" fill="#3498DB" text-anchor="start">Правило</text><text x="46.0" y="498.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Под непрерывной глиной может</text><text x="46.0" y="536.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">остаться нефть</text><polygon points="304.0,568 336.0,568 320.0,590" fill="#8A96A3"/><rect x="24" y="598" width="592" height="146" rx="12" fill="#0F1419" stroke="#2ECC71" stroke-width="3"/><text x="46.0" y="640.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="700" fill="#2ECC71" text-anchor="start">Вывод</text><text x="46.0" y="682.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Бурить боковой горизонтальный</text><text x="46.0" y="720.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">ствол под экран</text><rect x="24" y="760" width="592" height="146" rx="12" fill="#0F1419" stroke="#E74C3C" stroke-width="3"/><text x="46.0" y="802.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="700" fill="#E74C3C" text-anchor="start">Но бывает иначе</text><text x="46.0" y="844.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Прерывистая глина не удержит</text><text x="46.0" y="882.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">воду или газ</text><text x="24.0" y="940.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="400" fill="#8A96A3" text-anchor="start">стр. 418, 419, 421, 422</text></svg>