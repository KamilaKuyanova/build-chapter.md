<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 748" width="640" height="748" style="max-width:100%;height:auto"><rect width="640" height="748" rx="14" fill="#1A2129"/><rect x="24" y="22" width="115" height="44" rx="8" fill="#8E44AD"/><text x="39.0" y="54.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="600" fill="#FFFFFF" text-anchor="start">схема</text><text x="24.0" y="108.0" font-family="Segoe UI,system-ui,sans-serif" font-size="34" font-weight="700" fill="#ECEFF4" text-anchor="start">Место шага в главе</text><text x="24.0" y="162.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="400" fill="#8A96A3" text-anchor="start">опирается на</text><rect x="24" y="178" width="592" height="66" rx="12" fill="#0F1419" stroke="#3498DB" stroke-width="3"/><text x="46.0" y="220.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Уровень в ёмкости растёт</text><rect x="24" y="256" width="592" height="66" rx="12" fill="#0F1419" stroke="#3498DB" stroke-width="3"/><text x="46.0" y="298.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Что происходит после закрытия</text><rect x="24" y="334" width="592" height="66" rx="12" fill="#0F1419" stroke="#3498DB" stroke-width="3"/><text x="46.0" y="376.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Сколько долить при подъёме труб</text><polygon points="304.0,408 336.0,408 320.0,430" fill="#8A96A3"/><rect x="24" y="438" width="592" height="66" rx="12" fill="#F1C40F" stroke="#F1C40F" stroke-width="3"/><text x="46.0" y="480.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="700" fill="#0F1419" text-anchor="start">Как закрывают скважину по шагам</text><polygon points="304.0,512 336.0,512 320.0,534" fill="#8A96A3"/><text x="24.0" y="560.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="400" fill="#8A96A3" text-anchor="start">ведёт к</text><rect x="24" y="576" width="592" height="66" rx="12" fill="#0F1419" stroke="#2ECC71" stroke-width="3"/><text x="46.0" y="618.0" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="400" fill="#ECEFF4" text-anchor="start">Закрыть быстро или плавно</text><text x="24.0" y="688.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="400" fill="#8A96A3" text-anchor="start">построено из связей шагов · стр. 314,</text><text x="24.0" y="722.0" font-family="Segoe UI,system-ui,sans-serif" font-size="29" font-weight="400" fill="#8A96A3" text-anchor="start">315, 316</text></svg>